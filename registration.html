<!DOCTYPE html>
<html>
<head>
    <title>Ali Ahmed - Contact</title>
    <link rel="stylesheet" href="css/registration.css">
</head>
<body>

<header>
    <h1>Project Inquiry</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="information.html">Projects</a>
        <a href="registration.html">Contact</a>
    </nav>
</header>

<main>
    <form id="registration-form">

        <fieldset>
            <legend>Your Information</legend>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="16" max="100">

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date">
        </fieldset>

        <fieldset>
            <legend>Project Information</legend>

            <p>Project Type</p>
            <label><input type="radio" name="type" value="game" required> Game</label>
            <label><input type="radio" name="type" value="vr"> VR</label>
            <label><input type="radio" name="type" value="ar"> AR</label>

            <p>Services</p>
            <label><input type="checkbox" name="development"> Development</label>
            <label><input type="checkbox" name="prototype"> Prototype</label>
            <label><input type="checkbox" name="optimization"> Optimization</label>

            <label for="category">Project Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option>Small Project</option>
                <option>Medium Project</option>
                <option>Large Project</option>
            </select>

            <label for="message">Project Description</label>
            <textarea id="message" name="message" maxlength="500"></textarea>
        </fieldset>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</main>

<footer>
    <p>© 2026 Ali Ahmed</p>
</footer>

</body>
</html>
